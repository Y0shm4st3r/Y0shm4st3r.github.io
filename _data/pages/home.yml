method:
  snum:
    en: 02 - Method
    es: 02 - Método
  h2:
    en: How I work
    es: Cómo trabajo
  items:
    - h:
        en: I measure before I act
        es: Mido antes de actuar
      p:
        en: |-
          Every case on this site started with a measurement, not a configuration change. Several of them ended up proving me wrong, and that is a result too.
        es: |-
          Cada caso de este sitio empezó con una medición, no con un cambio de configuración. Varios terminaron demostrando que yo estaba equivocado, y eso también es un resultado.
    - h:
        en: I decompose before I replace
        es: Descompongo antes de reemplazar
      p:
        en: |-
          A summary number hides its parts. Splitting defects by hours, or a bed error into tilt and residual, turned an expensive purchase into a free adjustment more than once.
        es: |-
          Un número resumen esconde sus partes. Dividir defectos entre horas, o un error de cama en inclinación y residuo, convirtió más de una vez una compra cara en un ajuste gratis.
    - h:
        en: I verify state, not responses
        es: Verifico estado, no respuestas
      p:
        en: |-
          An "ok" means a message was accepted. A kill switch is only tested by taking the tunnel down; a saved setting is only real once I read it back.
        es: |-
          Un "ok" significa que el mensaje se aceptó. Un kill switch solo se prueba tumbando el túnel; un ajuste guardado solo es real cuando lo leo de vuelta.
    - h:
        en: I use identifiers that don't move
        es: Uso identificadores que no cambian
      p:
        en: |-
          Disks by world-wide name and serial, firmware by the build timestamp the machine reports. A name that changes between reboots identifies nothing.
        es: |-
          Discos por su WWN y número de serie, firmware por la fecha de compilación que reporta la máquina. Un nombre que cambia entre reinicios no identifica nada.
    - h:
        en: I separate failure domains
        es: Separo dominios de fallo
      p:
        en: |-
          Routing, compute and storage live on different hardware on purpose. It is the principle that has most often kept one problem from becoming two.
        es: |-
          Enrutamiento, cómputo y almacenamiento viven en hardware distinto a propósito. Es el principio que más veces ha evitado que un problema se convierta en dos.
    - h:
        en: I write my mistakes down with names
        es: Escribo mis errores con nombre propio
      p:
        en: |-
          Wrong hypotheses stay in the documentation next to the data that killed them. Those are the entries I actually re-read.
        es: |-
          Las hipótesis equivocadas se quedan en la documentación junto a los datos que las descartaron. Son las entradas que de verdad vuelvo a leer.
    - h:
        en: I reason through physical analogies
        es: Razono con analogías físicas
      p:
        en: |-
          A shared trunk is a hydraulic bottleneck, RAID parity is spare thread on a bolt, a warped plate is not fixed by shimming. The analogy is how I decide between an adjustment and a replacement.
        es: |-
          Un enlace troncal compartido es un cuello de botella hidráulico, la paridad de un arreglo son hilos de rosca de reserva, una placa pandeada no se arregla con cuñas. La analogía es cómo decido entre ajustar y reemplazar.
    - h:
        en: I rank open work by the cost of failure
        es: Priorizo lo pendiente por el costo del fallo
      p:
        en: |-
          Each project ends with what is still open, ordered by what it costs if it fails - not by how easy it is to close.
        es: |-
          Cada proyecto termina con lo que sigue abierto, ordenado por lo que cuesta si falla, no por lo fácil que es cerrarlo.

