# Página de inicio. Cada texto va en inglés (en) y español (es).
# projects: las tarjetas que llevan a cada sección. method y stack: compartidos por todo el sitio.

mast:
  eyebrow:
    en: Computer Engineering · Infrastructure, networking, systems
    es: Ingeniería de Computadoras · Infraestructura, redes, sistemas
  h1:
    en: Joshua<br>García Nieves
    es: Joshua<br>García Nieves
  thesis:
    en: |-
      I run the self-hosted infrastructure my household uses every day, rebuild machines from the firmware up, and write down what broke - including when it was me.
    es: |-
      Opero la infraestructura self-hosted que mi casa usa a diario, reconstruyo máquinas desde el firmware y documento lo que se rompió, incluso cuando el error fue mío.
  byline:
    en: Second-year Computer Engineering student, UAGM Gurabo · Self-taught in IT, networking and electronics · Currently focused on Python
    es: Estudiante de segundo año de Ingeniería de Computadoras, UAGM Gurabo · Autodidacta en IT, redes y electrónica · Actualmente enfocado en Python

intro:
  snum:
    en: 01 - The work
    es: 01 - El trabajo
  h2:
    en: Three projects, one way of working
    es: Tres proyectos, una misma forma de trabajar
  p:
    en: |-
      Each section below is a real system I built or maintain, written up the way I would hand it to a teammate: what the problem was, what I measured, what I ruled out, and what is still open. Every number on these pages came from the machine, not from memory.
    es: |-
      Cada sección es un sistema real que construí o mantengo, escrito como se lo entregaría a un compañero de equipo: cuál era el problema, qué medí, qué descarté y qué sigue abierto. Cada número de estas páginas salió de la máquina, no de la memoria.

