# Datos de un gráfico de barras. value = largo de la barra (escala 0..max).
# cells = columnas de la tabla accesible después del nombre; usa {en, es} si el texto cambia por idioma.

title:
  en: What the 1.938 mm is actually made of
  es: De qué está hecho realmente ese 1.938 mm
sub:
  en: |-
    Peak-to-peak contribution of each component, in millimetres. The parts do not add up to 1.938 - the two tilts reinforce each other at the corners - but the ranking is what matters: the only component I cannot remove is the smallest one.
  es: |-
    Contribución pico a pico de cada componente, en milímetros. Las partes no suman 1.938 - las dos inclinaciones se refuerzan en las esquinas - pero lo que importa es el orden: el único componente que no puedo quitar es el más pequeño.
