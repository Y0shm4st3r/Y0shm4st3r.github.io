# Datos de un gráfico de barras. value = largo de la barra (escala 0..max).
# cells = columnas de la tabla accesible después del nombre; usa {en, es} si el texto cambia por idioma.

title:
  en: Rate of decay, not accumulated count
  es: Velocidad de deterioro, no cantidad acumulada
sub:
  en: |-
    Defects per 1,000 power-on hours. Each disk's absolute count sits under its name - the chart's order does not match the order of those numbers.
  es: |-
    Defectos por cada 1000 horas de encendido. El conteo absoluto de cada disco aparece bajo su nombre: el orden del gráfico no coincide con el orden de esos números.
legend:
- series: s1
  label:
    en: Primary pool (double parity)
    es: Pool primario (doble paridad)
- series: s2
  label:
    en: Striped pool (no redundancy)
    es: Pool en franja (sin redundancia)
- series: s3
  label:
    en: Mirrored pool
    es: Pool en espejo
axis:
  en: defects per 1,000 power-on hours - scale 0 to 35
  es: defectos por 1000 horas de encendido - escala 0 a 35
columns:
  en:
  - Disk
  - Pool
  - Hours
  - Defects
  - Per 1,000 h
  es:
  - Disco
  - Pool
  - Horas
  - Defectos
  - Por 1000 h
hide:
  en: Hide data table
  es: Ocultar tabla de datos
max: 35
