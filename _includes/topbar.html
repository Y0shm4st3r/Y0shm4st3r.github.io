<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="{{ '/' | relative_url }}"><svg class="brand-mark" viewBox="0 0 56 56" width="18" height="18" aria-hidden="true"><rect class="i" x="0" y="0" width="16" height="16" rx="3"/><rect class="d" x="20" y="0" width="16" height="16" rx="3"/><rect class="d" x="40" y="0" width="16" height="16" rx="3"/><rect class="d" x="0" y="20" width="16" height="16" rx="3"/><rect class="i" x="20" y="20" width="16" height="16" rx="3"/><rect class="d" x="40" y="20" width="16" height="16" rx="3"/><rect class="a" x="0" y="40" width="16" height="16" rx="3"/><rect class="d" x="20" y="40" width="16" height="16" rx="3"/><rect class="i" x="40" y="40" width="16" height="16" rx="3"/></svg><span>Joshua García Nieves</span></a>
    <nav class="nav" aria-label="Sections">
      {%- for n in site.nav %}
      <a href="{{ n.href | relative_url }}"{% if page.url == n.href %} aria-current="page"{% endif %}><span data-l="en">{{ n.en }}</span><span data-l="es" hidden>{{ n.es }}</span></a>
      {%- endfor %}
    </nav>
    <div class="langsw" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>
</header>
