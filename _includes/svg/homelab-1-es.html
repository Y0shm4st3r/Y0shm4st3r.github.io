<svg aria-label="Diagrama de arquitectura: internet, switch gestionado, nodo de red con firewall virtualizado, cuatro VLANs y nodo de cómputo y almacenamiento" role="img" viewbox="0 0 900 636">

<line marker-end="url(#sa)" stroke="var(--rule)" x1="556" x2="556" y1="346" y2="372"></line>

<rect fill="var(--surface)" height="84" rx="5" stroke="var(--grid)" width="180" x="40" y="372"></rect>

<text class="d-s" x="58" y="448">la red interna</text>

<rect fill="var(--surface)" height="84" rx="5" stroke="var(--grid)" width="180" x="466" y="372"></rect>

<text class="d-s" x="484" y="448">Salida directa</text>
</g>

<text class="d-s" x="698" y="448">servidor de video</text>

<rect fill="var(--surface-2)" height="78" rx="4" stroke="var(--grid)" width="270" x="460" y="526"></rect>
<text class="d-t" x="476" y="548">Nodo de aplicaciones</text>
<text class="d-s" x="476" y="566">~22 contenedores. GPU</text>
<text class="d-s" x="476" y="582">dedicada por PCIe para</text>
<text class="d-s" x="476" y="598">visión y modelos locales</text>
</svg>
